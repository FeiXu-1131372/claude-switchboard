name: test
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }

      - name: Install Ubuntu deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Validate macOS universal sidecar
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          node scripts/build-bridge.mjs universal-apple-darwin
          test -x src-tauri/binaries/switchboard-statusline-aarch64-apple-darwin
          test -x src-tauri/binaries/switchboard-statusline-x86_64-apple-darwin
          lipo src-tauri/binaries/switchboard-statusline-aarch64-apple-darwin -verify_arch arm64
          lipo src-tauri/binaries/switchboard-statusline-x86_64-apple-darwin -verify_arch x86_64
          lipo src-tauri/binaries/switchboard-statusline-universal-apple-darwin -verify_arch arm64 x86_64

      - name: Frontend typecheck + tests
        run: |
          pnpm lint
          pnpm test

      - name: Rust tests
        if: runner.os != 'Windows'
        working-directory: src-tauri
        run: cargo test --workspace --all-features --no-fail-fast

      - name: Rust tests (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        # The Windows shell integration tests launch many PowerShell and Git
        # Bash processes. Running them together starves the timing-sensitive
        # pipe test on hosted runners, so serialize the Windows test harness.
        env:
          RUST_TEST_THREADS: 1
        run: cargo test --workspace --all-features --no-fail-fast

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
