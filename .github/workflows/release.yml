name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release'
        required: true

# Required so the workflow's GITHUB_TOKEN can create the release record and
# upload bundle artifacts to it. Repository-default token permissions are
# read-only since GitHub's 2023 hardening change; without this block both
# `tauri-action` (release create) and `gh release upload` fail with
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg,updater
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,updater
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.tag || github.ref_name }}
          releaseBody: 'Unsigned build — see README for first-launch instructions on each OS.'
          releaseDraft: true
          # The bundle config adds the statusline bridge as a sidecar (it is
          # kept out of the default config so `cargo test` needs no sidecar).
          args: --config src-tauri/tauri.bundle.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          includeUpdaterJson: true

  publish:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check updater manifest and publish complete release
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP/release-manifest"
          python3 - "$RUNNER_TEMP/release-manifest/latest.json" "$RELEASE_TAG" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          version = sys.argv[2].removeprefix("v")
          if manifest.get("version") != version:
              raise SystemExit("Updater version does not match the release tag")
          for platform in ("darwin-aarch64", "darwin-x86_64", "windows-x86_64"):
              entry = manifest.get("platforms", {}).get(platform, {})
              if not entry.get("url") or not entry.get("signature"):
                  raise SystemExit(f"Missing updater URL or signature for {platform}")
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
